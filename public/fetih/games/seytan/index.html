<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140a2a">
  <title>Şeytan Kovucular</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/hud.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../vendor/three/build/three.module.js",
        "three/addons/": "../../vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="world"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hud">
      <div id="title"><span>ŞEYTAN</span> <span>KOVUCULAR</span></div>
      <div id="topbar">
        <div id="round" class="chip"><span id="roundNo">TUR 1</span><span id="session"></span></div>
        <div id="timer" class="chip"><span id="timerTxt">2:00</span></div>
      </div>
      <div id="hpwrap">
        <div id="hpname">ŞEYTAN</div>
        <div id="hpbar"><div id="hplag"></div><div id="hpfill"></div><div id="hpshine"></div></div>
        <div id="hptxt">5000 / 5000</div>
      </div>
      <div id="status"></div>
      <div id="board" class="card"><div class="ttl">EN ÇOK TAŞ ATANLAR</div><ol id="boardList"></ol></div>
      <div id="ladder"></div>
      <div id="center"></div>
      <div id="result" class="hidden"></div>
      <button id="sound" class="hidden" type="button">🔊 sesi aç</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
